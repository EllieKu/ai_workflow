# Use dify/docker/docker-compose.yaml as the FIRST Compose file.
# This is a candidate configuration and is not applied automatically.
services:
  nginx:
    volumes:
      - ../../tools/portal-nginx/default.conf.template:/etc/nginx/conf.d/default.conf.template:ro
    environment:
      PORTAL_UPSTREAM: ${PORTAL_UPSTREAM:-host.docker.internal:8000}
      DIFY_AUTH_REQUEST_SECRET: ${DIFY_AUTH_REQUEST_SECRET:?Set DIFY_AUTH_REQUEST_SECRET}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports: !override
      - "${EXPOSE_NGINX_PORT:-80}:${NGINX_PORT:-80}"
      - "${EXPOSE_NGINX_SSL_PORT:-443}:${NGINX_SSL_PORT:-443}"
      - "127.0.0.1:8081:8081"
