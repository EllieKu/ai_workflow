# Use dify/docker/docker-compose.yaml as the FIRST Compose file.
# This is a candidate configuration and is not applied automatically.
services:
  portal:
    build:
      context: ../../dify-portal
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Local HTTP integration test only. Production must use HTTPS and false.
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: ${PORTAL_ALLOWED_HOSTS:-localhost,127.0.0.1,[::1]}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${PORTAL_CSRF_TRUSTED_ORIGINS:-}
      DJANGO_TRUST_PROXY: "true"
      DJANGO_SECRET_KEY_FILE: /run/secrets/portal_secret_key
      PORTAL_DATA_DIR: /app/data
      DIFY_GATEWAY_ENABLED: "true"
      DIFY_UPSTREAM_URL: http://nginx:8081
      DIFY_AUTH_REQUEST_SECRET: ${DIFY_AUTH_REQUEST_SECRET:?Set DIFY_AUTH_REQUEST_SECRET}
    volumes:
      - type: bind
        source: ../../dify-portal/data
        target: /app/data
      - type: bind
        source: ../../dify-portal/.secret-key
        target: /run/secrets/portal_secret_key
        read_only: true
        bind:
          create_host_path: false
    command:
      - sh
      - -c
      - >-
        python manage.py migrate --noinput &&
        python manage.py collectstatic --noinput &&
        exec gunicorn --bind 0.0.0.0:8000 --workers 2 --timeout 120 config.wsgi:application
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8000/health/', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s

  nginx:
    volumes:
      - ../../tools/portal-nginx/default.conf.template:/etc/nginx/conf.d/default.conf.template:ro
    environment:
      PORTAL_UPSTREAM: portal:8000
      DIFY_AUTH_REQUEST_SECRET: ${DIFY_AUTH_REQUEST_SECRET:?Set DIFY_AUTH_REQUEST_SECRET}
    depends_on:
      portal:
        condition: service_healthy
    ports: !override
      - "${EXPOSE_NGINX_PORT:-80}:${NGINX_PORT:-80}"
      - "${EXPOSE_NGINX_SSL_PORT:-443}:${NGINX_SSL_PORT:-443}"
      - "127.0.0.1:8081:8081"
