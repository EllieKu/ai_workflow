{% extends 'portal/base.html' %}
{% block title %}修改密碼 · AI Portal{% endblock %}
{% block content %}
<section class="login">
  <h1>修改密碼</h1>
  {% if password_change_required %}
  <p>目前使用的是管理員設定的臨時密碼。完成修改後才能使用機器人。</p>
  {% endif %}
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">儲存新密碼</button>
  </form>
</section>
{% endblock %}
