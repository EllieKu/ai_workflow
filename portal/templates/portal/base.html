{% load static %}
<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AI Portal{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'portal/site.css' %}">
</head>
<body>
  <header>
    <a href="{% url 'portal:bot-list' %}" class="brand">AI Portal</a>
    {% if user.is_authenticated %}
      <nav aria-label="帳號">
        <span>{{ user.username }}</span>
        {% if user.is_staff %}<a href="{% url 'admin:index' %}">管理</a>{% endif %}
        <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button type="submit">登出</button></form>
      </nav>
    {% endif %}
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
